name: Gerar banco SQLite de produção (2021-2023)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gerar-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install httpx

      - name: Gerar banco SQLite
        run: python scripts/gerar_base_sqlite.py

      - name: Commit e push do banco
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/producao.db
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no banco."
          else
            git commit -m "chore(dpp): atualiza banco SQLite de produção (2021-2023)"
            git push
          fi
