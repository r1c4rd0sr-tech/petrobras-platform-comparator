name: Atualizar produção ANP (Temporal)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  atualizar-producao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install httpx

      - name: Atualizar banco de produção com novos arquivos da ANP
        run: python scripts/atualizar_producao_anp.py

      - name: Commit e push do banco atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/producao.db backend/data/anp/processados.json
          if git diff --cached --quiet; then
            echo "Nenhum arquivo novo da ANP."
          else
            git commit -m "chore(data): atualiza banco de produção com novos arquivos da ANP"
            git push
          fi
