name: Gerar banco SQLite de plataformas

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_platforms_db.py"
      - "backend/data/platforms/**"

permissions:
  contents: write

jobs:
  gerar-platforms-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar banco de plataformas
        run: python scripts/build_platforms_db.py

      - name: Commit e push do banco
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/petrobras_platforms.db
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no banco."
          else
            git commit -m "chore(data): atualiza banco SQLite de plataformas"
            git push
          fi
