name: Gerar base de produção (2021-2023)

on:
  push:
    branches: [main]
    paths:
      - "scripts/gerar_base_producao.py"
      - ".github/workflows/gerar-base-producao.yml"
  workflow_dispatch:

jobs:
  gerar-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install httpx

      - name: Gerar base pré-agregada
        run: python scripts/gerar_base_producao.py

      - name: Commit e push da base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/producao_mensal.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança na base."
          else
            git commit -m "chore(dpp): atualiza base pré-agregada de produção (2021-2023)"
            git push
          fi
