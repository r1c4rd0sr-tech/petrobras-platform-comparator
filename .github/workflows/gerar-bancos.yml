name: Gerar bancos de Refino, Gás e Logística

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  gerar-bancos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 pandas

      - name: Baixar CSVs da ANP
        run: python scripts/download_anp_csvs.py

      - name: Gerar banco de Refino
        run: python scripts/build_refino_db.py

      - name: Gerar banco de Gás
        run: python scripts/build_gas_db.py

      - name: Gerar banco de Logística
        run: python scripts/build_logistica_db.py

      - name: Commit dos bancos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/*.db
          if git diff --cached --quiet; then
            echo "Nenhum banco alterado."
          else
            git commit -m "chore(data): atualiza bancos de refino, gás e logística"
            git push
          fi
