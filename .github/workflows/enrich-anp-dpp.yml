name: Enriquecer base com dados ANP Do Poço ao Posto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/scripts/enrich_from_anp_dpp.py"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Executar enriquecimento ANP DPP
        run: python backend/scripts/enrich_from_anp_dpp.py
      - name: Commit e push das atualizações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/platforms/part-*.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore: enriquece base com dados ANP Do Poço ao Posto"
            git push
          fi